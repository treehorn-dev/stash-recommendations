name: Release Stash Plugin

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Stash package assets
        run: python3 scripts/build_plugin_package.py --version "${GITHUB_REF_NAME#v}" --output-dir release-assets
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes release-assets/*
